name: MojangCheck
version: '1.0.0'
main: com.unitycraft.mojangcheck.MojangCheckPlugin
api-version: '1.21'
author: UnityCraft
description: Plugin de diagnostico para probar conectividad del servidor con los servidores de Mojang (usado para diagnosticar problemas de skins de NPCs).

commands:
  mojangcheck:
    description: Prueba la conectividad del servidor con los servidores de Mojang
    usage: /mojangcheck
    permission: mojangcheck.use

permissions:
  mojangcheck.use:
    description: Permite usar el comando /mojangcheck
    default: op
