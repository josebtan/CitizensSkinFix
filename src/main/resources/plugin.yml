name: CitizensSkinFix
version: '1.0.0'
main: com.unitycraft.citizensskinfix.CitizensSkinFixPlugin
api-version: '1.21'
author: UnityCraft
description: Plugin de diagnostico para probar conectividad del servidor con los servidores de Mojang (usado para diagnosticar problemas de skins de NPCs de Citizens).

commands:
  citizensskinfix:
    description: Prueba la conectividad del servidor con los servidores de Mojang
    usage: /citizensskinfix
    permission: citizensskinfix.use

permissions:
  citizensskinfix.use:
    description: Permite usar el comando /citizensskinfix
    default: op
